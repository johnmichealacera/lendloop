services:
  n8n:
    image: n8nio/n8n:2.45.7
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    env_file: n8n/.env
    environment:
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      # The cloudflared tunnel is one proxy hop in front of n8n.
      N8N_PROXY_HOPS: "1"
      # Workflows read the shared secrets with {{ $env.NAME }}, so exported JSON never contains them.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # Code nodes verify HMAC signatures with Node's crypto (createHmac, timingSafeEqual).
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro

volumes:
  n8n_data:
